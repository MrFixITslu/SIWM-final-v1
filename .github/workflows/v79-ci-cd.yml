name: V79 CI/CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: v79-ci-cd-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and validate application
        shell: bash
        run: |
          set -euo pipefail
          run_project() {
            local dir="$1"
            echo "==> Checking $dir"
            pushd "$dir" >/dev/null
            if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
            for script in lint check test build; do
              if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['$script'] ? 0 : 1)"; then npm run "$script"; else echo "No $script script; skipping"; fi
            done
            popd >/dev/null
          }
          run_project .
          if [ -f backend/package.json ]; then run_project backend; fi
      - name: Verify Docker image can build
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: docker build --tag v79-ci-image .
      - name: Create delivery bundle
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=backend/node_modules --exclude='*.tar.gz' -czf "${RUNNER_TEMP}/${GITHUB_REPOSITORY##*/}-${GITHUB_SHA::12}.tar.gz" .
      - name: Upload delivery bundle
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/*.tar.gz
          retention-days: 14
          if-no-files-found: error
  deliver-container:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Detect Dockerfile
        id: docker
        shell: bash
        run: |
          if [ -f Dockerfile ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to GHCR
        if: ${{ steps.docker.outputs.enabled == 'true' }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish immutable image
        if: ${{ steps.docker.outputs.enabled == 'true' }}
        shell: bash
        run: |
          IMAGE="${{ steps.docker.outputs.image }}"
          SHORT_SHA="${GITHUB_SHA::12}"
          docker build -t "$IMAGE:latest" -t "$IMAGE:$SHORT_SHA" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHORT_SHA"
      - name: Delivery note
        if: ${{ steps.docker.outputs.enabled != 'true' }}
        run: echo "No root Dockerfile; the release bundle is this repository's continuous-delivery artifact."
